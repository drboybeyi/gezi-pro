<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#8b6f47">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gezi Pro">
  <meta name="description" content="Gezdiğin yerleri fotoğraflarla ve haritada topla — Gezi Pro">

  <title>Gezi Pro</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./assets/icon.svg">
  <link rel="apple-touch-icon" href="./assets/icon.svg">

  <!-- Leaflet (harita) -->
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>

  <!-- exif-js: fotoğraftan GPS/tarih okuma (global EXIF) -->
  <script src="https://cdn.jsdelivr.net/npm/exif-js@2.3.0/exif.js"></script>

  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <header class="header" style="display:none">
    <div class="header-left">
      <span class="header-logo">🧭</span>
      <span class="header-title">Gezi Pro</span>
    </div>
    <div class="header-right">
      <span class="header-count" id="headerCount"></span>
      <button class="header-btn" id="logoutBtn" aria-label="Çıkış yap" title="Çıkış yap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </header>

  <main id="app">
    <div class="loading">Yükleniyor…</div>
  </main>

  <nav class="bottom-nav" style="display:none">
    <!-- Nav items injected by app.js -->
  </nav>

  <button class="fab" id="fabBtn" style="display:none" aria-label="Fotoğraf ekle">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2.5"
         stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"/>
      <line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
  </button>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
